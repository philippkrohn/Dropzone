name: PK faction source review
on:
  push:
    branches: ['update/training-catalog-2026-09']
    paths: ['.github/workflows/training-sources.yml', 'operations/collect_training_sources.py']
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install beautifulsoup4==4.13.5
      - run: python operations/collect_training_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pk-faction-sources
          path: training-sources/
          retention-days: 7
