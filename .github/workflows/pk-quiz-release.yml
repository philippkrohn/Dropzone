name: Publish PK Stratagems Quiz
on:
  push:
    branches: ['feature/faction-quizzes']
    paths: ['.github/workflows/pk-quiz-release.yml']
permissions:
  contents: write
concurrency:
  group: pk-stratagems-quiz-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Materialize integrity-checked source
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma
          from pathlib import Path, PurePosixPath
          parts=[Path(f'operations/quiz-source-{i:02}.b64').read_text().strip() for i in range(1,6)]
          raw=lzma.decompress(base64.b64decode(''.join(parts),validate=True))
          assert hashlib.sha256(raw).hexdigest()=='e9f2102369f2230993243df677637d3dde8f48de2282d6231adc601381e5974d'
          files=json.loads(raw); assert len(files)==13
          for name,content in files.items():
              path=PurePosixPath(name)
              assert not path.is_absolute() and '..' not in path.parts
              assert path.parts[0] in ['README.md','tools','tests','quiz']
              target=Path('pkstratagems')/name
              target.parent.mkdir(parents=True,exist_ok=True)
              target.write_text(content,encoding='utf-8')
          print('Verified and materialized 13 source files.')
          PY
      - name: Verify logic and assemble additive integration
        run: |
          node --check pkstratagems/quiz/app.mjs
          node --check pkstratagems/quiz/core.mjs
          node --test pkstratagems/tests/core.test.mjs
          python pkstratagems/tools/assemble.py
      - name: Prepare browser and encrypted authorization tools
        run: |
          python -m pip install playwright==1.55.0 cryptography==46.0.1
          python -m playwright install --with-deps chromium
      - name: Test existing interface and new quiz locally
        run: |
          python -m http.server 8768 --directory pkstratagems > /tmp/pk-quiz-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python pkstratagems/tests/browser.py
      - name: Preserve tested human-readable source in feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add pkstratagems/README.md pkstratagems/tools pkstratagems/tests pkstratagems/quiz pkstratagems/index.html pkstratagems/integration-report.json
          if ! git diff --cached --quiet; then
            git commit -m 'Add tested generic faction quiz section and preserve existing PK entry point'
            git push origin HEAD:feature/faction-quizzes
          fi
      - name: Prepare run-bound encrypted release channel
        run: python pkstratagems/tools/prepare_key.py
      - uses: actions/upload-artifact@v4
        with:
          name: pk-quiz-public-key
          path: pkstratagems/release-public/
          retention-days: 1
      - name: Publish preview, verify, then publish and verify production
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python pkstratagems/tools/release.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pk-quiz-release-qa
          path: |
            pkstratagems/qa/
            pkstratagems/integration-report.json
          if-no-files-found: ignore
          retention-days: 7
