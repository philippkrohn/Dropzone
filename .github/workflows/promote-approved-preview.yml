name: Correct publish root and promote approved PK preview
on:
  push:
    branches: ['fix/pk-preview-publication-2026-09-27']
    paths: ['.github/workflows/promote-approved-preview.yml', 'operations/promote_preview.py', 'operations/prepare_with_existing_doubles.py', 'operations/publish_snapshot.py']
permissions:
  contents: read
concurrency:
  group: pk-approved-preview-promotion
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare approved static output, complete legacy assets and correct root config
        run: |
          python -m pip install beautifulsoup4==4.13.5 cryptography==46.0.1 playwright==1.55.0
          python operations/prepare_with_existing_doubles.py
          python pkstratagems/tests/catalog_v2.py
          node --test pkstratagems/tests/training.test.mjs > /tmp/pk-training-tests.log
          tail -8 /tmp/pk-training-tests.log
      - name: Check the complete output in a browser
        run: |
          python -m playwright install --with-deps chromium
          python -m http.server 8765 --directory delivery/site > /tmp/pk-promotion-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python pkstratagems/tests/browser_v2.py --base http://127.0.0.1:8765/ --public
      - uses: actions/upload-artifact@v4
        with:
          name: pk-corrected-static-package
          path: delivery/packages/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: pk-promotion-public-key
          path: delivery/authorization/
          retention-days: 1
      - name: Publish only the hash-verified bundle to the original site
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python operations/publish_snapshot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pk-promotion-evidence
          path: |
            delivery/evidence/
            pkstratagems/qa/
          if-no-files-found: ignore
          retention-days: 14
