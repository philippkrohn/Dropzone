name: Validate Dropzone
on:
  push:
    branches: [main]
    paths: ['*.html', '*.css', '*.mjs', 'sw.js', 'data/**', 'tests/**', '.github/workflows/check.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: dropzone-qa
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify source content and program logic
        run: |
          python tests/verify_content.py
          node --check app.mjs
          node --check sw.js
          node --test tests/core.test.mjs
      - name: Install browser test tools
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Exercise all scenarios and mobile views
        run: |
          python -m http.server 8765 --directory .. > /tmp/dropzone-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python tests/browser_smoke.py
      - name: Keep visual and functional test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dropzone-qa
          path: qa-artifacts/
          if-no-files-found: ignore
