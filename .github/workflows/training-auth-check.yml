name: PK final authorization and release
on:
  push:
    branches: ['update/training-catalog-2026-09']
    paths: ['.github/workflows/training-auth-check.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: pk-training-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare validated source and safe error diagnostics
        run: |
          python -m pip install beautifulsoup4==4.13.5 cryptography==46.0.1 playwright==1.55.0
          python pkstratagems/tools/assemble_v2.py
          python pkstratagems/tests/catalog_v2.py
          node --test pkstratagems/tests/training.test.mjs > /tmp/pk-tests.log
          tail -8 /tmp/pk-tests.log
          python - <<'PY'
          from pathlib import Path
          p=Path('pkstratagems/tools/release_v2.py');s=p.read_text()
          old=" except urllib.error.HTTPError as e:raise RuntimeError('Netlify endpoint returned HTTP '+str(e.code)) from None"
          new=""" except urllib.error.HTTPError as e:
            body=e.read(4096).decode('utf-8','replace').strip()
            category='proxy-unauthorized' if body=='Unauthorized' else ('api-json' if body.startswith('{') else 'other')
            diagnostic={'status':e.code,'category':category,'method':method,'path':path,'bodyBytes':len(body),'requestId':e.headers.get('x-nf-request-id','')}
            (ROOT/'qa/auth-diagnostic.json').write_text(json.dumps(diagnostic,indent=2))
            print('Sanitized authorization diagnostic:',json.dumps(diagnostic),flush=True)
            raise RuntimeError('Netlify endpoint returned HTTP '+str(e.code)+' ('+category+')') from None"""
          assert old in s;s=s.replace(old,new)
          old="result['previewDeploy']=deploy(PREVIEW,secret['previewProxy'])"
          new="""# An allowed read separates credential rejection from upload-format errors.
          probe=netlify_request(secret['previewProxy'],'/api/v1/deploys/6ab26f893b9a84bc8aed6e5f')
          assert probe.get('site_id')==PREVIEW,'Unexpected preview identity; stop.'
          print('Scoped preview authorization passed.',flush=True)
          result['previewDeploy']=deploy(PREVIEW,secret['previewProxy'])"""
          assert old in s;s=s.replace(old,new);p.write_text(s)
          PY
          python -m playwright install --with-deps chromium
      - name: Preserve complete tested build and source
        run: |
          mkdir -p deliverables
          cd pkstratagems/netlify-site
          zip -qr ../../deliverables/pk-training-netlify-source.zip .
          cd ../..
          git archive --format=zip --output=deliverables/pk-training-repository.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pk-training-ready-build
          path: deliverables/
          retention-days: 14
      - name: Create run-bound public key
        run: python pkstratagems/tools/prepare_key.py
      - uses: actions/upload-artifact@v4
        with:
          name: pk-training-public-key
          path: pkstratagems/release-public/
          retention-days: 1
      - name: Authorize, preview, test and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pkstratagems/tools/release_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pk-final-release-evidence
          path: pkstratagems/qa/
          if-no-files-found: ignore
          retention-days: 14
