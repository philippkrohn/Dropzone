name: PK final authorization and release
on:
  push:
    branches: ['update/training-catalog-2026-09']
    paths: ['.github/workflows/training-auth-check.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: pk-training-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Assemble and preserve existing Doubles files byte-for-byte
        run: |
          python -m pip install beautifulsoup4==4.13.5 cryptography==46.0.1 playwright==1.55.0
          python pkstratagems/tools/assemble_v2.py
          python pkstratagems/tools/preserve_doubles.py
          python pkstratagems/tests/catalog_v2.py
          node --test pkstratagems/tests/training.test.mjs > /tmp/pk-tests.log
          tail -8 /tmp/pk-tests.log
          python -m playwright install --with-deps chromium
      - name: Verify the assembled application in a browser
        run: |
          python -m http.server 8765 --directory pkstratagems/netlify-site/public > /tmp/pk-http.log 2>&1 &
          SERVER=$!
          trap 'kill $SERVER' EXIT
          python pkstratagems/tests/browser_v2.py --base http://127.0.0.1:8765/ --public
      - name: Preserve tested build and source
        run: |
          mkdir -p deliverables
          cd pkstratagems/netlify-site
          zip -qr ../../deliverables/pk-training-netlify-source.zip .
          cd ../..
          git archive --format=zip --output=deliverables/pk-training-repository.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: pk-training-ready-build
          path: deliverables/
          retention-days: 14
      - name: Create run-bound public key
        run: python pkstratagems/tools/prepare_key.py
      - uses: actions/upload-artifact@v4
        with:
          name: pk-training-public-key
          path: pkstratagems/release-public/
          retention-days: 1
      - name: Authorize, preview, test and publish
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python pkstratagems/tools/release_v2.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pk-final-release-evidence
          path: pkstratagems/qa/
          if-no-files-found: ignore
          retention-days: 14
